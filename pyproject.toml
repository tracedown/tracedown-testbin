[project]
name = "tracedown-testbin"
version = "0.1.0"
description = "Deterministic HTTP target for testing Lace probes and the Tracedown platform. httpbin-like, tailored to cover every Lace assertion scope, call-config field and Tracedown pipeline behavior."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
